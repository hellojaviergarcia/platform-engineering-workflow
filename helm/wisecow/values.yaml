replicaCount: 3

image:
  repository: ghcr.io/anuragstark/wisecow-python
  pullPolicy: Always
  tag: "latest"

imagePullSecrets:
  - name: ghcr-secret
nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  port: 80
  targetPort: 4499

ingress:
  enabled: true
  className: "nginx"
  annotations: {}
  hosts:
    - host: wisecow.example.com
      paths:
        - path: /
          pathType: Prefix

resources:
  requests:
    memory: "128Mi"
    cpu: "250m"
  limits:
    memory: "256Mi"
    cpu: "500m"

securityContext:
  runAsNonRoot: false
  runAsUser: 0
  capabilities:
    drop: ["ALL"]

podSecurityContext:
  fsGroup: 2000

networkPolicy:
  enabled: true

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
