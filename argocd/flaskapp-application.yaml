apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: flaskapp
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/hellojaviergarcia/platform-engineering-workflow.git'
    targetRevision: HEAD
    path: helm/flaskapp
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: flaskapp
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
